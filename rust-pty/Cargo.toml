[package]
name = "rust-pty"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true # Automatically strip symbols from the binary
opt-level = 3
lto = "fat"
codegen-units = 1


[lib]
crate-type = ["cdylib"]

[dependencies]
# https://github.com/wezterm/wezterm/issues/6783
portable-pty = { version = "0.8.1", features = ["serde_support"] }
lazy_static = "1.4"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1.0"
libc = "0.2"
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_System_IO", "Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_Storage"] }